name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.sh
      - lib/**
      - products/**
      - tests/**
      - sources.lock
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        product: [nginx]
    env:
      NEXUS_BUILD_ROOT: ${{ runner.temp }}/nexus-build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nexus-build/cache
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        run: ./build.sh ${{ matrix.product }}

      - name: Test
        run: tests/${{ matrix.product }}.sh "$NEXUS_BUILD_ROOT"/out/${{ matrix.product }}-*.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}
          path: |
            ${{ runner.temp }}/nexus-build/out/${{ matrix.product }}-*.tar.xz
            ${{ runner.temp }}/nexus-build/out/${{ matrix.product }}-*.json
