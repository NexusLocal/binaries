name: Build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: The packages to build
        type: choice
        options: [changed, all]
        default: changed
  push:
    branches: [main]
    paths:
      - build.sh
      - lib/**
      - licenses/**
      - packages.json
      - products/**
      - tests/**
      - sources.lock
      - .github/workflows/build.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The packages that changed after the last successful Build of main. A run that fails or that a
  # newer push stops does not count. So the next run builds its changes too.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      php: ${{ steps.plan.outputs.php }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Choose the packages
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOICE: ${{ inputs.packages }}
        run: |
          base="all"
          if [ "$CHOICE" != "all" ]; then
            base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // "all"')"
          fi
          echo "base: $base"
          scripts/plan-build.sh "$base" > "$RUNNER_TEMP/packages.json"
          jq -r '.[].name' "$RUNNER_TEMP/packages.json"
          echo "packages=$(jq -c . "$RUNNER_TEMP/packages.json")" >> "$GITHUB_OUTPUT"
          echo "php=$(jq -c '[.[] | select(.product == "php") | .version]' "$RUNNER_TEMP/packages.json")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.packages != '[]' }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/nexus-build/cache
          key: sources-${{ matrix.name }}-${{ hashFiles('sources.lock') }}

      - name: Build
        env:
          NEXUS_BUILD_ROOT: ${{ runner.temp }}/nexus-build
        run: ./build.sh ${{ matrix.product }} ${{ matrix.version }}

      - name: Test
        env:
          NEXUS_BUILD_ROOT: ${{ runner.temp }}/nexus-build
        run: tests/${{ matrix.product == 'mariadb' && 'mysql' || matrix.product }}.sh "$NEXUS_BUILD_ROOT"/out/${{ matrix.name }}*-macos-arm64.tar.xz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ runner.temp }}/nexus-build/out/${{ matrix.name }}*-macos-arm64.tar.xz
            ${{ runner.temp }}/nexus-build/out/${{ matrix.name }}*-macos-arm64.json
            ${{ runner.temp }}/nexus-build/out/${{ matrix.name }}*-macos-arm64.sources.txt

  # The release does not wait for this job. A problem of WP-CLI must not stop a security update
  # of PHP.
  wp-cli:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.php != '[]' }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.plan.outputs.php) }}
    name: wp-cli (php-${{ matrix.php }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-${{ matrix.php }}
          path: dist

      - name: Test WP-CLI
        run: tests/wp-cli.sh dist/php-${{ matrix.php }}*-macos-arm64.tar.xz

  # A package whose build or test failed has no artifact. A package that is not in the plan has no
  # artifact either. scripts/publish.sh keeps its package of the newest manifest. So the other
  # packages still get their update. The manifest also gets the new Node.js, Composer and WP-CLI.
  release:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # The newest support.lock. A change of it starts no build.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.plan.outputs.packages != '[]' }}
        with:
          path: dist
          merge-multiple: true

      - name: Publish the releases and the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          scripts/publish.sh dist

  # The owner gets an issue and an email when a build, a test or the publication fails on main.
  report:
    needs: [plan, build, release, wp-cli]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open or update the issue "Build failed"
        run: |
          title="Build failed"
          body="A build, a test or the publication of $GITHUB_SHA failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. A package that was not published keeps its last package in the manifest."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee RoodFruit
          fi
