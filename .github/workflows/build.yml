name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.sh
      - lib/**
      - products/**
      - tests/**
      - sources.lock
      - .github/workflows/build.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: nginx, product: nginx, version: "" }
          - { name: httpd, product: httpd, version: "" }
          - { name: redis-7.2, product: redis, version: "7.2" }
          - { name: redis-8.2, product: redis, version: "8.2" }
          - { name: redis-8.10, product: redis, version: "8" }
          - { name: mysql-8.0, product: mysql, version: "8.0" }
          - { name: mysql-8.4, product: mysql, version: "8.4" }
          - { name: mysql-9.7, product: mysql, version: "9.7" }
          - { name: mariadb-10.11, product: mariadb, version: "10.11" }
          - { name: mariadb-11.4, product: mariadb, version: "11.4" }
          - { name: mariadb-11.8, product: mariadb, version: "11.8" }
          - { name: mariadb-12.3, product: mariadb, version: "12.3" }
          - { name: postgresql-14, product: postgresql, version: "14" }
          - { name: postgresql-15, product: postgresql, version: "15" }
          - { name: postgresql-16, product: postgresql, version: "16" }
          - { name: postgresql-17, product: postgresql, version: "17" }
          - { name: postgresql-18, product: postgresql, version: "18" }
          - { name: php-8.5, product: php, version: "8.5" }
          - { name: php-8.4, product: php, version: "8.4" }
          - { name: php-8.3, product: php, version: "8.3" }
          - { name: php-8.2, product: php, version: "8.2" }
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nexus-build/cache
          key: sources-${{ matrix.name }}-${{ hashFiles('sources.lock') }}

      - name: Build
        env:
          NEXUS_BUILD_ROOT: ${{ runner.temp }}/nexus-build
        run: ./build.sh ${{ matrix.product }} ${{ matrix.version }}

      - name: Test
        env:
          NEXUS_BUILD_ROOT: ${{ runner.temp }}/nexus-build
        run: tests/${{ matrix.product == 'mariadb' && 'mysql' || matrix.product }}.sh "$NEXUS_BUILD_ROOT"/out/${{ matrix.name }}*-macos-arm64.tar.xz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ runner.temp }}/nexus-build/out/${{ matrix.name }}*-macos-arm64.tar.xz
            ${{ runner.temp }}/nexus-build/out/${{ matrix.name }}*-macos-arm64.json
            ${{ runner.temp }}/nexus-build/out/${{ matrix.name }}*-macos-arm64.sources.txt

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the releases and the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish.sh dist
